name: Build NuvioTV (upstream + self-host backend)

on:
  push:
    branches: [dev]
    paths: ['.github/**']
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: NuvioMedia/NuvioTV
          ref: dev
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch CI signing keystore (from fork)
        run: |
          curl -sSL https://raw.githubusercontent.com/vgupta1192/NuvioTV/dev/nuviotv.jks -o nuviotv.jks
          test -s nuviotv.jks

      - name: Create local.properties (self-hosted backend)
        run: |
          printf '%s\n' \
            'NUVIO_SUPABASE_URL=https://nuviobackend.kissmissi.duckdns.org' \
            'NUVIO_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg5NzY2MDkyLCJleHAiOjE5NDc0NDYwOTJ9.XB5a12DpW9Uf11QARCv4AAfYHGyk4qRq2Oi_7t8t7X0' \
            'NUVIO_SUPABASE_FALLBACK_URL=' \
            'SIMKL_CLIENT_ID=cf7f2a335cfcd9759fa01d752d9cf8f42fb4fa1a4e4ff08fe4cafb84ec836621' \
            'AVATAR_PUBLIC_BASE_URL=https://nuviobackend.kissmissi.duckdns.org/storage/v1/object/public/avatars' \
            'TRAKT_REDIRECT_URI=urn:ietf:wg:oauth:2.0:oob' \
            > local.properties
          cp local.properties local.dev.properties

      - name: Build debug APK
        env:
          CI_USE_DEBUG_SIGNING: 'true'
        run: |
          set -o pipefail
          ./gradlew :app:assembleFullDebug --stacktrace 2>&1 | tee build-log.txt

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleFullRelease --stacktrace 2>&1 | tee build-log-release.txt || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-apks
          path: app/build/outputs/apk/full/*/*.apk
          if-no-files-found: error

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-build-${{ github.run_number }}
          name: NuvioTV upstream build ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/full/*/*.apk

      - name: Attach build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-debug-logs
          name: TV CI debug logs
          prerelease: true
          files: build-log.txt
