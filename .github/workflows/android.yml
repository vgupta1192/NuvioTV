name: Build NuvioTV APK

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create local.properties (self-hosted backend)
        run: |
          cat > local.properties <<'PROPS'
          NUVIO_SUPABASE_URL=https://nuviobackend.kissmissi.duckdns.org
          NUVIO_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg5NzY2MDkyLCJleHAiOjE5NDc0NDYwOTJ9.XB5a12DpW9Uf11QARCv4AAfYHGyk4qRq2Oi_7t8t7X0
          NUVIO_SUPABASE_FALLBACK_URL=
          AVATAR_PUBLIC_BASE_URL=https://nuviobackend.kissmissi.duckdns.org/storage/v1/object/public/avatars
          PROPS
          cp local.properties local.dev.properties
          sed -i 's/^          //' local.properties local.dev.properties

      - name: Build debug APK
        run: ./gradlew :app:assembleFullDebug --stacktrace

      - name: Build release APK (best effort)
        run: ./gradlew :app:assembleFullRelease --stacktrace
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-apks
          path: app/build/outputs/apk/full/*/*.apk
          if-no-files-found: error

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-build-${{ github.run_number }}
          name: NuvioTV build ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/full/*/*.apk
