name: Build NuvioTV Jellyfin+LiveTV (upstream release sync)
# sync-pulse: forced 2026-10-28T19:42Z

on:
  push:
    branches: [master]
    paths: ['.github/**']
  workflow_dispatch:
    # Builds are triggered by the local watcher on vgupta1192's box
    # (~/bin/nuvio-sync-check.sh nuviotv): GitHub's schedule event drops runs
    # for hours, so the old hourly cron never fired reliably. The watcher
    # pushes a sync-pulse commit when upstream has an unbuilt release, which
    # lands here via the push trigger above.

permissions:
  contents: write

# one LiveTV build at a time; separate group so it never races the main android.yml run
concurrency:
  group: build-nuviotv-jellyfin-livetv
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream release
        id: ver
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Newest non-draft release, prereleases included: /releases/latest skips prereleases,
          # and NuvioTV ships its 1.1.0 betas only as prereleases (2026-10-15).
          REL=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/NuvioMedia/NuvioTV/releases?per_page=10" \
            | python3 -c "import json,sys;r=[x for x in json.load(sys.stdin) if not x.get('draft')];r.sort(key=lambda x:x.get('published_at') or '',reverse=True);print(json.dumps(r[0]))")
          UP=$(printf '%s' "$REL" | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          # attach the upstream release notes so fork releases carry the upstream changelog
          {
            echo 'notes<<GHR_NOTES_EOF_9d41f'
            printf 'Fork CI build of upstream %s.\n\n' "$UP"
            printf '%s' "$REL" | python3 -c "import json,sys;print(json.load(sys.stdin).get('body') or '(no upstream release notes)')"
            echo 'GHR_NOTES_EOF_9d41f'
          } >> "$GITHUB_OUTPUT"
          VER="${UP%%-*}"
          echo "upstream tag: $UP (version $VER)"
          BUILT=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/vgupta1192/NuvioTV/releases/tags/tv-jellyfin-livetv-$UP")
          # workflow_dispatch or a head commit message containing [force-build] rebuilds
          # even when the release already exists
          FORCE=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then FORCE=true; fi
          if echo "$HEAD_MSG" | grep -qi '\[force-build\]'; then FORCE=true; fi
          SHOULD=true
          if [ "$BUILT" = "200" ] && [ "$FORCE" != "true" ]; then
            RENAMED=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/vgupta1192/NuvioTV/releases/tags/tv-jellyfin-livetv-$UP" | jq --arg want "NuvioTV-JellyfinTV-${VER}-b" '[.assets[] | select(.name | startswith($want))] | length')
            if [ "${RENAMED:-0}" -ge 1 ]; then echo "already built with release naming, skipping"; SHOULD=false; else echo "release exists but assets need renaming, rebuilding"; fi
          fi
          echo "should_build=$SHOULD" >> "$GITHUB_OUTPUT"
          echo "tag=$UP" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.ver.outputs.should_build == 'true'
        with:
          repository: NuvioMedia/NuvioTV
          # pinned: the full patch chain (121 patches) was verified to apply with zero failures
          # at this commit on 2026-10-30. Upstream dev moved past it and broke 23 patches
          # (incl. the mandatory tv-jellyfin-cinematic-ui). Re-pin only after re-simulating
          # the whole chain against the new dev tip.
          ref: 157caada0c365b0ae35e659a312cd2f829f9eda1
          lfs: true

      - uses: actions/checkout@v4
        if: steps.ver.outputs.should_build == 'true'
        with:
          path: fork-src
          sparse-checkout: .github/patches

      # Self-host fork patch: the addon manager's refresh re-reads every addon manifest, and
      # foreground/periodic pulls re-read manifests older than 30 min, so new addon versions
      # (same URL) reach a running app. If upstream changed the code so the patch no longer
      # applies, the build goes on without it and the Telegram message says so.
      - name: Apply addon-manifest-refresh patch
        id: patch_manifest
        if: steps.ver.outputs.should_build == 'true'
        run: |
          P=fork-src/.github/patches/addon-manifest-refresh.patch
          if git apply "$P" || git apply --3way "$P"; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          else
            echo "::warning::addon-manifest-refresh.patch no longer applies to upstream dev; building without it"
            git reset --hard -q
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      # Self-host fork patch: the in-app updater checks this fork's releases and compares the CI
      # run number (asset names ...-b<run>-..., BuildConfig.FORK_BUILD) instead of the version name.
      - name: Apply fork-updater patch
        id: patch_updater
        if: steps.ver.outputs.should_build == 'true'
        run: |
          P=fork-src/.github/patches/fork-updater.patch
          if git apply "$P" || git apply --3way "$P"; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          else
            echo "::warning::fork-updater.patch no longer applies to upstream dev; building without it"
            git checkout -- app/build.gradle.kts app/src/full 2>/dev/null; git clean -fdq app/src/full
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi


      # jellyfin-livetv variant: its updater follows only tv-jellyfin-livetv-* releases (applied after fork-updater)
      - name: Apply jellyfintv-updater patch
        if: steps.ver.outputs.should_build == 'true'
        run: |
          if ! git apply fork-src/.github/patches/jellyfintv-updater.patch; then
            echo "::error::jellyfintv-updater.patch no longer applies to upstream dev"
            exit 1
          fi

      # Jellyfin+LiveTV combo: Live TV feature + the Jellyfin integration and its own side-install
      # variant (applicationIdSuffix ".jellyfintv"). All required: without the variant the APK would
      # install over another Nuvio app. reshaped-autosync replaces upstream AutoSync with the
      # NuvioTV-Reshaped version (subtitle-autosync branch): AutoSync V2, bubble toasts and the
      # audio sync fallback (sherpa-onnx speech recognition, Silero VAD). Its extractor-wrap
      # section (RewrappableExtractor + libass swap + observer rewrap) is upstream since
      # #4132 and is no longer carried. mdblist-library-fix = fork 739848ac3: MDBList library
      # writes no longer freeze the app on many lists; add-to-library answers from cache.
      # avi-packed-bframes = fork 90cebbfda reduced port (3 files): packed XviD/DivX MPEG-4 part 2
      # chunks split into one sample per VOP with presentation times (the fork's renderer-side
      # DecodeOrderTimestamps/PresentationOrderTimes half needs the skipped 0954ef772 player
      # overhaul and is not carried; the stock renderer consumes the unpacker's output as-is).
      # catalog-flowon-default = fork 9845b2749 reduced port: CatalogRepositoryImpl.getCatalog's
      # mapping/merging runs on Dispatchers.Default so Home draws while rows arrive (the fork's
      # comment hunk needs fork-only infra and is not carried). tv-instant-catalogs below is
      # re-anchored to the flowOn'd fun close. baseline-profile-libs = fork c5b66d8db reduced
      # port (1 file): the baselineProfile filter also keeps the libraries startup runs through
      # (the fork's generator half needs its own 857-line generator and is not carried).
      - name: Apply feature and variant patches
        if: steps.ver.outputs.should_build == 'true'
        run: |
          for F in livetv-feature jellyfin-feature avi-formats avi-opendml avi-packed-bframes backdrop-fix subtitle-third-language library-genre-tmdb mdblist-library-fix search-results-sooner catalog-flowon-default baseline-profile-libs parallel-range-rate-gate jellyfintv-variant reshaped-autosync; do
            if ! git apply "fork-src/.github/patches/$F.patch"; then
              echo "::error::$F.patch no longer applies to upstream dev"
              exit 1
            fi
          done
          git diff --stat

      # Build optimization (optional): publish only the armeabi-v7a APK, and stop building the
      # arm64/x86/x86_64 splits + universal APK the rename step throws away. If upstream changed
      # the splits block, build unoptimized rather than fail.
      - name: Apply ABI build-optimization patch (optional)
        if: steps.ver.outputs.should_build == 'true'
        run: |
          if git apply fork-src/.github/patches/tv-abi-v7a.patch; then
            echo "v7a-only splits: building 1 APK instead of 5"
          else
            echo "::warning::tv-abi-v7a.patch no longer applies; building all ABI APKs as before"
          fi

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.should_build == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Optional ports from DavidVamaiotu's Nuvio*-Reshaped, one patch per feature. They are
      # warning-only: a patch that no longer applies is skipped and the build goes on without it.
      - name: Apply optional Reshaped ports
        if: steps.ver.outputs.should_build == 'true'
        run: |
          # optional-ports
          for P in tv-volume-softclip tv-debuglog-qr livetv-robustness custom-stretch jellyfin-subtitles audio-sync-hls tv-volume-boost-bar tv-phone-entry tv-seek-previews tv-connection-fit tv-subtitle-fonts tv-audio-sync-dash tv-seek-previews-hls tv-generated-subtitles tv-synced-subtitles tv-library-calendar; do
            if git apply "fork-src/.github/patches/$P.patch"; then
              echo "applied $P.patch"
            else
              echo "::warning::$P.patch no longer applies to upstream; building without it"
            fi
          done

      # Fork feature (applies on top of the whole chain, mandatory): Jellyfin screen rewrite —
      # cinematic home (hero carousel + row per library) + full-screen detail page reusing the
      # app's own HeroContentSection/CastSection, with media badges and People row.
      - name: Apply Jellyfin cinematic UI patch
        if: steps.ver.outputs.should_build == 'true'
        run: |
          if ! git apply fork-src/.github/patches/tv-jellyfin-cinematic-ui.patch; then
            echo "::error::tv-jellyfin-cinematic-ui.patch no longer applies to upstream dev"
            exit 1
          fi

      # Ports of features from luqmanfadlli/NuvioMobile-Enhanced / nuvio-native-legacy and fork-original
      # extras, one patch per feature. Warning-only: a patch that no longer applies is skipped.
      - name: Apply Enhanced ports
        if: steps.ver.outputs.should_build == 'true'
        run: |
          # enhanced-ports
          for P in tv-livetv-iptv-sources tv-pinned-sources tv-private-viewing tv-instant-catalogs tv-episode-sort tv-wetrakr tv-hide-unconfigured-trakt tv-dynamic-home-background tv-stream-search tv-episode-go-to tv-autosync-bubble-fix tv-player-quality-chooser tv-user-ratings tv-picture-sound tv-youtube-playback tv-youtube-diag tv-youtube-livetv tv-youtube-mainplayer tv-youtube-quality-button custom-stretch-continuous custom-stretch-memory custom-stretch-steady custom-stretch-stable custom-stretch-shots tv-autosync-second-round tv-autosync-giveup-panel tv-synced-plus-key tv-subtitle-list-sync-again tv-sync-again-keep-saved tv-youtube-captions tv-youtube-livetv-captions tv-youtube-captions-shared-fetch tv-youtube-captions-rate-limit tv-youtube-captions-disk-cache tv-youtube-captions-account-sync tv-youtube-captions-server tv-youtube-captions-file-sidecar tv-player-time-toggle tv-youtube-captions-clean-rolling tv-youtube-continue-watching tv-livetv-custom-stretch tv-crash-report tv-debuglog-advanced tv-crash-report-anr tv-livetv-adult-perf tv-stability tv-livetv-stretch-log tv-livetv-keep-awake tv-livetv-idle-recover tv-api-client-tuning tv-livetv-ambient-guard tv-livetv-stretch-wide-bars tv-livetv-stretch-wide-channels tv-livetv-iptv-settings tv-netflix-style tv-livetv-netflix-style tv-netflix-parity tv-dx-sound-modes tv-dx-picture-enhance tv-dx-remember-keys tv-dx-second-subtitle tv-dx-stream-stats tv-dx-watched-titles tv-dx-watch-stats tv-dx-intro-sounds tv-dx-addon-backup tv-dx-profile-insights tv-dx-second-subtitle-always tv-hero-rotation-speed tv-auto-mpv-failover tv-dx-polish tv-native-thumbs tv-small-ports tv-buttons-order-news tv-library-random tv-stall-hint tv-finish-series-row tv-fork-features tv-streams-solid tv-publicmetadb tv-fork-ports-2 tv-fork-ports-3 tv-startup-profile tv-episode-rating-icons tv-rating-colors tv-updater-hardening tv-tvdb-ordering-ui tv-credits-detector tv-quiet-focus-fonts tv-ambient-tint tv-glass-surfaces tv-smart-highlights tv-playback-intro tv-auto-quality tv-genres-reminders tv-port-compile-fixes tv-updater-install-gate; do
            if git apply "fork-src/.github/patches/$P.patch"; then
              echo "applied $P.patch"
            else
              echo "::warning::$P.patch no longer applies to upstream; building without it"
            fi
          done

      # Signing keystore comes from the repo secret TV_KEYSTORE_B64 (rotated 2026-10-30 after
      # the old keystore was found committed publicly — that key must be considered burned).
      # APKs signed with the new key do not update over installs signed with the old one.
      - name: Fetch CI signing keystore (from secret)
        if: steps.ver.outputs.should_build == 'true'
        env:
          KS_B64: ${{ secrets.TV_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > nuviotv.jks
          test -s nuviotv.jks

      - name: Create local.properties (self-hosted backend)
        if: steps.ver.outputs.should_build == 'true'
        env:
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.TV_KEY_ALIAS }}
        run: |
          printf '%s\n' \
            'NUVIO_SUPABASE_URL=https://nuviobackend.kissmissi.duckdns.org' \
            "NUVIO_SUPABASE_ANON_KEY=$NUVIO_SUPABASE_ANON_KEY" \
            'NUVIO_SUPABASE_FALLBACK_URL=' \
            'AVATAR_PUBLIC_BASE_URL=https://nuviobackend.kissmissi.duckdns.org/storage/v1/object/public/avatars' \
            "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" \
            "MDBLIST_CLIENT_ID=$MDBLIST_CLIENT_ID" \
            "TMDB_API_KEY=$TMDB_API_KEY" \
            "NUVIO_RELEASE_STORE_PASSWORD=$NUVIO_RELEASE_STORE_PASSWORD" \
            "NUVIO_RELEASE_KEY_ALIAS=$NUVIO_RELEASE_KEY_ALIAS" \
            "NUVIO_RELEASE_KEY_PASSWORD=$NUVIO_RELEASE_STORE_PASSWORD" \
            'TRAKT_REDIRECT_URI=urn:ietf:wg:oauth:2.0:oob' \
            'TV_LOGIN_WEB_BASE_URL=https://nuviobackend.kissmissi.duckdns.org/tv-login' \
            'DEVICE_LOGIN_WEB_BASE_URL=https://nuvioweb.kissmissi.duckdns.org/link' \
            > local.properties
          cp local.properties local.dev.properties

      # Upstream translation typos: "\\'" (escaped backslash + bare apostrophe) fails aapt with
      # "Invalid unicode escape sequence" (values-it, upstream f63154726, run #47). Rewrite to "\'".
      - name: Fix upstream string-resource escapes
        if: steps.ver.outputs.should_build == 'true'
        run: |
          python3 - <<'PY'
          import glob
          for f in glob.glob('app/src/main/res/values*/*.xml'):
              s = open(f, encoding='utf-8').read()
              n = s.count("\\\\'")
              if n:
                  open(f, 'w', encoding='utf-8').write(s.replace("\\\\'", "\\'"))
                  print(f"{f}: fixed {n}")
          PY

      # Upstream keeps translating strings that fork patches also ship in their own
      # values-<lang>/*.xml files; the copies then fail mergeFullReleaseResources with
      # "Duplicate resources" (values-it autosync_*, run #45). In translation folders only,
      # drop from patch-added (untracked) files every name upstream's files already define.
      - name: Drop fork translations upstream now ships
        if: steps.ver.outputs.should_build == 'true'
        run: |
          python3 - <<'PY'
          import glob, os, re, subprocess
          untracked = set(subprocess.run(['git', 'ls-files', '--others', '--exclude-standard', 'app/src/main/res'],
                                         capture_output=True, text=True, check=True).stdout.split())
          name_re = r'<(string|plurals|string-array)\s+name="%s"[^>]*>.*?</\1>[ \t]*\n?'
          for d in sorted(glob.glob('app/src/main/res/values-*')):
              files = glob.glob(os.path.join(d, '*.xml'))
              upstream = set()
              for f in files:
                  if f not in untracked:
                      upstream |= set(re.findall(r'<(?:string|plurals|string-array)\s+name="([^"]+)"', open(f, encoding='utf-8').read()))
              for f in files:
                  if f not in untracked:
                      continue
                  s = open(f, encoding='utf-8').read()
                  dups = [n for n in re.findall(r'<(?:string|plurals|string-array)\s+name="([^"]+)"', s) if n in upstream]
                  for n in dups:
                      s = re.sub(name_re % re.escape(n), '', s, flags=re.S)
                  if dups:
                      open(f, 'w', encoding='utf-8').write(s)
                      print(f"{f}: dropped {len(dups)} upstream-translated: {' '.join(dups)}")
          PY

      # Native thumbnail decoder (Rust, tv-native-thumbs.patch); skipped when that patch did not apply.
      - name: Set up Rust for native thumbnails
        if: steps.ver.outputs.should_build == 'true'
        run: |
          if [ -d native ]; then
            rustup target add armv7-linux-androideabi
            cargo install cargo-ndk --locked
          fi

      - name: Thumbnail cache write key
        if: steps.ver.outputs.should_build == 'true'
        env:
          THUMBS_WRITE_TOKEN: ${{ secrets.THUMBS_WRITE_TOKEN }}
        run: |
          F=app/src/main/java/com/nuvio/tv/ui/screens/player/seekpreview/local/CloudThumbToken.kt
          if [ -n "$THUMBS_WRITE_TOKEN" ] && [ -f "$F" ]; then
            printf 'package com.nuvio.tv.ui.screens.player.seekpreview.local\n\ninternal object CloudThumbToken {\n    const val VALUE = "%s"\n}\n' "$THUMBS_WRITE_TOKEN" > "$F"
          fi

      - name: Build release APK
        if: steps.ver.outputs.should_build == 'true'
        env:
          FORK_BUILD: ${{ github.run_number }}
        run: |
          set -o pipefail
          if ! ./gradlew :app:assembleFullRelease --stacktrace 2>&1 | tee build-log-release.txt; then
            # Show Kotlin compile errors as annotations (readable without signing in).
            grep -E '^e: ' build-log-release.txt | head -30 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            grep -E 'What went wrong' -A4 build-log-release.txt | head -12 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            # Failures without either pattern (daemon crash, OOM, resource merge) left no
            # annotation at all (#45); also show the log tail.
            grep -v '^\s*$' build-log-release.txt | grep -v '^\s*at ' | tail -25 | while IFS= read -r line; do echo "::warning::${line:0:900}"; done
            exit 1
          fi

      - name: Rename artifacts (armeabi-v7a release only)
        if: steps.ver.outputs.should_build == 'true'
        run: |
          mkdir -p release-files
          for f in app/build/outputs/apk/full/*/*armeabi-v7a*release*.apk; do
            base="$(basename "$f")"
            cp "$f" "release-files/NuvioTV-JellyfinTV-${{ steps.ver.outputs.ver }}-b${{ github.run_number }}-${base#app-full-}"
          done
          ls -l release-files

      - name: Upload artifacts
        if: steps.ver.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-JellyfinTV-apks
          path: release-files/*.apk
          if-no-files-found: error

      - name: Publish to release
        if: steps.ver.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-jellyfin-livetv-${{ steps.ver.outputs.tag }}
          name: NuvioTV Jellyfin+LiveTV ${{ steps.ver.outputs.tag }}
          prerelease: true
          body: ${{ steps.ver.outputs.notes }}
          files: release-files/*.apk

      - name: Remove legacy-named assets
        if: steps.ver.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: NuvioTV-JellyfinTV-${{ steps.ver.outputs.ver }}-b${{ github.run_number }}-
          TAG: tv-jellyfin-livetv-${{ steps.ver.outputs.tag }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
            | jq -r --arg keep "$KEEP" --argjson run "${{ github.run_number }}" '.assets[]
                | select(.name | startswith($keep) | not)
                | select((((.name | capture("-b(?<n>[0-9]+)-") | .n) // "0") | tonumber) < $run)
                | .id' \
            | while read -r id; do
                echo "deleting legacy asset $id"
                gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
              done

      - name: Notify Telegram
        if: steps.ver.outputs.should_build == 'true' && env.TG_BOT_TOKEN != '' && env.TG_CHAT_ID != ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          REL_TAG: tv-jellyfin-livetv-${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.tag }}
          PATCHED: ${{ steps.patch_manifest.outputs.applied }}
          UPD_PATCHED: ${{ steps.patch_updater.outputs.applied }}
          BUILD_NO: ${{ github.run_number }}
        run: |
          if [ "$PATCHED" = "true" ]; then NOTE="Includes: addon refresh patch (refresh button + auto re-read of addon manifests)"; else NOTE="⚠️ addon refresh patch did NOT apply to this upstream version — built without it"; fi
          if [ "$UPD_PATCHED" = "true" ]; then NOTE="${NOTE}
          Build ${BUILD_NO}: patched TVs show the update banner at app start (or Settings → check for updates) and install it in-app"; else NOTE="${NOTE}
          ⚠️ fork-updater patch did NOT apply — this build updates only by manual APK install"; fi
          NOTE="${NOTE}
          Live TV + Jellyfin feature included (installs side-by-side via .jellyfintv suffix)"
          HASH=""
          for f in release-files/*.apk; do
            [ -e "$f" ] || continue
            HASH="${HASH}$(basename "$f"): $(stat -c%s "$f") bytes, sha256 $(sha256sum "$f" | cut -c1-16)..."
          done
          MSG="📺 NuvioTV Jellyfin+LiveTV ${VER} is ready
          Upstream release: ${VER}
          ${NOTE}
          ${HASH}
          Download: https://github.com/vgupta1192/NuvioTV/releases/tag/${REL_TAG}
          (installs alongside the main NuvioTV app)"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null

      - name: Attach build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-jellyfin-livetv-debug-logs
          name: Jellyfin+LiveTV CI debug logs
          prerelease: true
          files: build-log-release.txt
